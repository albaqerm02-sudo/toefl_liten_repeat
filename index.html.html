<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listen and Repeat</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2f6; --surface:#fff; --ink:#1b2430; --muted:#6b7686; --line:#cfd8e3;
  --accent:#1f5fbf; --accent-ink:#fff; --rec:#c2410c; --good:#15803d; --bad:#b91c1c;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --surface:#18202a; --ink:#e8edf3; --muted:#8b97a7; --line:#2b3644;
    --accent:#5b9bf0; --accent-ink:#0b1220; --rec:#fb923c; --good:#4ade80; --bad:#f87171;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#18202a; --ink:#e8edf3; --muted:#8b97a7; --line:#2b3644;
  --accent:#5b9bf0; --accent-ink:#0b1220; --rec:#fb923c; --good:#4ade80; --bad:#f87171;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;min-height:100%}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
h1{font-size:22px;margin:0 0 4px}
p{margin:0;color:var(--muted);line-height:1.5}
textarea{width:100%;min-height:240px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:17px;line-height:1.5;padding:10px;margin-top:10px}
button{font:inherit;font-size:17px;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:disabled{opacity:.35;cursor:not-allowed}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.rec{background:var(--rec);color:#fff}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>button{flex:1 1 140px}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.status{min-height:24px;color:var(--muted)}
.heard{font-size:16px;color:var(--muted);margin-top:8px}
.sent{font-size:20px;line-height:1.7}
.sent .ok{color:var(--good)}
.sent .no{color:var(--bad);text-decoration:underline}
.score{font-size:30px;font-weight:700;margin-bottom:6px}
.hide{display:none}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">

<section id="setup" class="card">
  <h1>Listen and Repeat</h1>
  <p>Paste your sentences, one per line.</p>
  <textarea id="src" lang="en" spellcheck="false" placeholder="The library closes at nine tonight.&#10;Please return the books by Friday.&#10;…"></textarea>
  <div class="row" style="margin-top:10px"><button id="start">Start practice</button></div>
  <p id="warn" style="margin-top:8px"></p>
</section>

<section id="practice" class="hide">
  <div class="card">
    <div class="meta"><span id="count">Sentence 0 of 0</span><button class="sec" id="reset" style="padding:6px 12px;font-size:15px">Back</button></div>
    <div class="bar"><i id="prog"></i></div>
  </div>
  <div class="card">
    <div class="row">
      <button id="listen">🔊 Listen</button>
      <button id="repeat" disabled>🎤 Repeat</button>
      <button id="submit" class="sec" disabled>Submit</button>
    </div>
    <div class="status" id="status" style="margin-top:12px" aria-live="polite">Press Listen to hear a sentence.</div>
    <div class="heard" id="heard"></div>
  </div>
  <div class="card hide" id="result">
    <div class="score" id="score"></div>
    <div class="sent" id="marked"></div>
  </div>
  <div class="card hide" id="final">
    <div class="score" id="total"></div>
    <table id="tbl"></table>
    <div class="row" style="margin-top:12px"><button id="again">Practice again</button></div>
  </div>
</section>

</div>
<script>
const $=id=>document.getElementById(id);
const synth=window.speechSynthesis;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let queue=[],idx=-1,cur=null,results=[],voice=null,rec=null,transcript='',interim='',recording=false,listening=false,graded=false;

function pickVoice(){const v=synth.getVoices().filter(x=>/^en/i.test(x.lang));voice=v.find(x=>/en-US/i.test(x.lang))||v[0]||null}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
try{const s=localStorage.getItem('lr-src');if(s)$('src').value=s}catch(e){}

const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).filter(Boolean);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function show(id,on){$(id).classList.toggle('hide',!on)}
function status(t){$('status').textContent=t}

$('start').onclick=()=>{
  const lines=$('src').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!lines.length){$('warn').textContent='Add at least one sentence.';return}
  if(!synth){$('warn').textContent='Speech playback is not supported in this browser.';return}
  if(!SR){$('warn').textContent='Microphone recognition needs Chrome, Edge or Safari.';return}
  try{localStorage.setItem('lr-src',$('src').value)}catch(e){}
  queue=shuffle(lines.slice());idx=-1;results=[];cur=null;
  show('setup',false);show('practice',true);show('final',false);show('result',false);
  $('listen').disabled=false;$('repeat').disabled=true;$('submit').disabled=true;
  $('heard').textContent='';status('Press Listen to hear a sentence.');updateCount();
};
$('reset').onclick=()=>{stopAll();show('practice',false);show('setup',true)};
$('again').onclick=()=>$('start').click();

function updateCount(){
  const n=Math.max(idx+1,0);
  $('count').textContent=`Sentence ${n} of ${queue.length}`;
  $('prog').style.width=(results.length/queue.length*100)+'%';
}
function stopAll(){
  if(synth)synth.cancel();
  if(rec){try{rec.onend=null;rec.abort()}catch(e){}}
  recording=false;listening=false;
}

$('listen').onclick=()=>{
  if(idx+1>=queue.length||listening)return;
  idx++;cur=queue[idx];graded=false;transcript='';interim='';
  show('result',false);$('heard').textContent='';updateCount();
  $('listen').disabled=true;$('repeat').disabled=true;$('submit').disabled=true;
  status('Listening…');listening=true;
  synth.cancel();
  const u=new SpeechSynthesisUtterance(cur);u.lang='en-US';if(voice)u.voice=voice;
  u.onend=u.onerror=()=>{listening=false;$('repeat').disabled=false;status('Now press Repeat and say the sentence.')};
  synth.speak(u);
};

$('repeat').onclick=()=>{
  if(recording)return;
  transcript='';interim='';
  rec=new SR();rec.lang='en-US';rec.continuous=false;rec.interimResults=true;
  rec.onresult=e=>{
    let fin='',tmp='';
    for(let i=0;i<e.results.length;i++){
      (e.results[i].isFinal?(fin+=e.results[i][0].transcript+' '):(tmp+=e.results[i][0].transcript));
    }
    transcript=fin;interim=tmp;
    $('heard').textContent=(fin+tmp).trim();
  };
  rec.onerror=e=>{lastErr=e.error;$('heard').textContent='Mic error: '+e.error;
    if(e.error==='not-allowed'||e.error==='service-not-allowed')status('Microphone access is blocked. Allow it in your browser settings.');
    else if(e.error!=='no-speech'&&e.error!=='aborted')status('Microphone error: '+e.error);
  };
  rec.onend=()=>{recording=false;$('repeat').classList.remove('rec');if(!graded&&!submitting){$('repeat').disabled=false}};
  try{rec.start();recording=true;submitting=false;$('repeat').classList.add('rec');$('repeat').disabled=true;$('submit').disabled=false;status('Recording… say the sentence, then press Submit.')}
  catch(e){status('Could not start the microphone.')}
};
let submitting=false,lastErr='';
$('submit').onclick=()=>{
  $('submit').disabled=true;submitting=true;status('Checking…');
  if(recording){try{rec.stop()}catch(e){}setTimeout(grade,1800)}else grade();
};

function grade(){
  if(graded)return;graded=true;submitting=false;
  const spoken=norm((transcript+' '+interim));
  const words=cur.split(/\s+/);
  const ref=words.map(w=>norm(w).join(' '));
  // LCS alignment
  const m=ref.length,n=spoken.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=ref[i-1]===spoken[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const hit=Array(m).fill(false);
  for(let i=m,j=n;i>0&&j>0;){
    if(ref[i-1]===spoken[j-1]&&ref[i-1]){hit[i-1]=true;i--;j--}
    else if(dp[i-1][j]>=dp[i][j-1])i--;else j--;
  }
  const ok=hit.filter(Boolean).length;
  results.push({s:cur,ok,total:m});
  $('score').textContent=`${ok} of ${m} words correct`+(spoken.length?'':' (nothing was heard'+(lastErr?' - error: '+lastErr:'')+')');
  $('marked').innerHTML=words.map((w,i)=>`<span class="${hit[i]?'ok':'no'}">${esc(w)}</span>`).join(' ');
  show('result',true);updateCount();
  if(idx+1>=queue.length){
    status('Done. See your total below.');finish();
  }else{
    status('Press Listen for the next sentence.');$('listen').disabled=false;
  }
  $('repeat').disabled=true;$('submit').disabled=true;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function finish(){
  const ok=results.reduce((a,r)=>a+r.ok,0),tot=results.reduce((a,r)=>a+r.total,0);
  $('total').textContent=`Total: ${ok} of ${tot} words (${Math.round(ok/tot*100)}%)`;
  $('tbl').innerHTML=results.map(r=>`<tr><td>${esc(r.s)}</td><td>${r.ok}/${r.total}</td></tr>`).join('');
  show('final',true);$('listen').disabled=true;
}
</script>
</body>
</html>
